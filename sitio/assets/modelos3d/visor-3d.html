<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torre Arbide — Recorrido 3D por nivel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<style>
  :root{
    --bg: #20262a;
    --bg-panel: #262c31;
    --line: rgba(245,243,239,.1);
    --ink: #f5f3ef;
    --ink-dim: rgba(245,243,239,.65);
    --tan: #a8a59b;
    --tan-light: #c9c3ae;
    --disponible: #7cb389;
    --pendiente: #d99a4e;
    --font-sans: 'Montserrat', sans-serif;
    --font-display: 'Cormorant Garamond', serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);height:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;font-family:var(--font-sans);}

  .app{display:flex;flex:1;min-height:0;flex-wrap:wrap;}

  /* ---- Lista de niveles ---- */
  nav.levels{
    width:230px;flex-shrink:0;border-right:1px solid var(--line);
    padding:18px 12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;
  }
  .level-actions{display:flex;gap:8px;margin-bottom:6px;}
  .reset-btn{
    all:unset;box-sizing:border-box;flex:1;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:10px 6px;
    border:1px solid var(--line);border-radius:2px;color:var(--ink-dim);
    font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;
    line-height:1.3;
    transition:border-color .2s ease, color .2s ease;
  }
  .reset-btn:hover{border-color:var(--tan-light);color:var(--ink);}
  .reset-btn.exit-btn{order:99;flex:0 0 auto;width:100%;margin-top:8px;}
  .reset-btn.exit-btn:hover{border-color:#e08a8a;color:var(--ink);}
  .level-card{
    background:var(--cream, #f5f3ef);color:#2f3537;border-radius:8px;padding:12px 14px;
    cursor:pointer;border:2px solid transparent;transition:border-color .15s ease, transform .15s ease;
  }
  .level-card:hover{transform:translateX(2px);}
  .level-card.active{border-color:var(--tan);}
  .level-card .name{font-family:var(--font-sans);font-weight:700;font-size:14.5px;}
  .level-card .units{font-size:11.5px;color:#5a5d63;margin-top:2px;}
  .level-card .badge{
    display:inline-block;margin-top:6px;font-size:10px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:20px;
  }
  .level-card .badge.modeled{background:rgba(124,179,137,.15);color:#3f7350;}
  .level-card .badge.pending{background:rgba(217,154,78,.18);color:#8a5a1f;}

  /* ---- Visor 3D ---- */
  main.viewer{flex:1 1 40%;min-width:280px;position:relative;display:flex;flex-direction:column;}
  .viewer-instructions{
    flex:0 0 auto;padding:9px 16px;text-align:center;
    font-size:11.5px;color:var(--ink-dim);letter-spacing:.02em;
    background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);
  }
  #canvas-wrap{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;}
  canvas:active{cursor:grabbing;}
  /* Aviso de carga / error: centrado sobre el visor, con barra de progreso */
  .debug-status{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;
    width:min(300px,86%);text-align:center;font-size:12.5px;font-weight:600;letter-spacing:.02em;
    color:var(--tan-light);background:rgba(20,22,26,.92);padding:16px 18px;border-radius:8px;
    border:1px solid rgba(201,195,174,.3);line-height:1.5;white-space:pre-wrap;
  }
  .debug-status .bar{height:4px;margin-top:12px;background:rgba(245,243,239,.12);border-radius:4px;overflow:hidden;}
  .debug-status .bar i{display:block;height:100%;width:0;background:var(--tan-light);transition:width .2s ease;}
  .debug-status.err{color:#e08a8a;border-color:rgba(224,138,138,.5);}
  .debug-status.err .bar{display:none;}
  .debug-status .retry{
    all:unset;cursor:pointer;margin-top:12px;padding:8px 14px;border:1px solid currentColor;border-radius:2px;
    font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  }

  /* ---- Panel de render 2D ---- */
  aside.render-panel{
    width:360px;flex-shrink:0;background:var(--bg-panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .render-panel .ph{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);font-size:13px;text-align:center;padding:24px;line-height:1.5;
  }
  .render-panel img{width:100%;display:block;}
  .render-panel .cap{
    padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-dim);line-height:1.5;
  }
  .render-panel .cap strong{
    font-family:var(--font-display);font-style:italic;font-weight:600;
    color:var(--ink);font-size:17px;display:block;margin-bottom:2px;
  }

  /* ---- Tarjetas de unidades disponibles (bajo el render) ---- */
  .units-section{padding:14px 16px;border-top:1px solid var(--line);overflow-y:auto;}
  .units-section h4{
    margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-dim);font-weight:600;
  }
  .unit-card{
    display:flex;flex-direction:column;gap:0;
    background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;margin-bottom:12px;cursor:pointer;transition:border-color .15s ease;
  }
  .unit-card:hover{border-color:rgba(201,195,174,.4);}
  .unit-card.selected{border-color:var(--tan-light);}
  .unit-card .u-thumb{
    width:100%;height:96px;background-color:#14161a;background-repeat:no-repeat;
  }
  .unit-card .u-body{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
  }
  .unit-card .u-name{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:16px;color:var(--ink);}
  .unit-card .u-name .tag{
    font-family:var(--font-sans);font-style:normal;font-size:10px;font-weight:700;
    letter-spacing:.05em;color:#20262a;background:var(--tan-light);
    padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle;
  }
  .unit-card .u-sub{font-size:12px;color:var(--ink-dim);margin-top:3px;}
  .unit-card .u-go{
    font-size:11.5px;color:var(--tan-light);font-weight:600;white-space:nowrap;
    cursor:pointer;padding:8px 4px;margin:-8px -4px;border-radius:4px;
    transition:color .15s ease, text-decoration-color .15s ease;
    text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;
  }
  .unit-card .u-go:hover, .unit-card .u-go:focus-visible{color:var(--ink);text-decoration-color:currentColor;outline:none;}
  .pb-desc{font-size:13px;line-height:1.7;color:var(--ink-dim);}
  .pb-desc ul{margin:8px 0 0;padding-left:18px;}
  .pb-desc li{margin-bottom:6px;}

  /* ---- Contorno azul sobre el render al seleccionar una unidad ---- */
  .render-img-wrap{position:relative;}
  .render-img-wrap img{width:100%;display:block;}
  .unit-highlight{
    position:absolute;
    border:3px solid #4ea3ff;
    box-shadow:0 0 0 3px rgba(78,163,255,.25), 0 0 18px rgba(78,163,255,.55);
    border-radius:4px;pointer-events:none;display:none;
    transition:top .25s ease, height .25s ease, left .25s ease, width .25s ease;
  }
  .unit-highlight.visible{display:block;}

  /* ---- Piezas solo-móvil: ocultas en escritorio ---- */
  .m-topbar, .sheet-handle{display:none;}
  .render-body{display:contents;}

  /* ---- Móvil: pantalla completa ----
     barra superior fija (Salir / Ver todo) · niveles (Planta Baja → Nivel 5) · modelo 3D ·
     panel inferior con los departamentos disponibles (se expande para ver el plano) */
  @media (max-width:900px){
    :root{--peek-h:150px;}
    .m-topbar{
      display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;
      padding:8px 10px;padding-top:max(8px, env(safe-area-inset-top));
      background:#1b2024;border-bottom:1px solid var(--line);
    }
    .m-title{font-family:var(--font-display);font-style:italic;font-size:17px;color:var(--ink-dim);}
    .m-btn{
      all:unset;box-sizing:border-box;min-height:40px;padding:0 14px;display:flex;align-items:center;justify-content:center;
      border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.05);color:var(--ink);
      font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .m-btn:active{background:rgba(255,255,255,.14);}
    .m-btn.exit{border-color:rgba(224,138,138,.55);}

    .app{position:relative;flex-direction:column;flex-wrap:nowrap;}

    /* niveles: carrusel horizontal, de abajo hacia arriba */
    nav.levels{
      order:1;width:100%;flex:0 0 auto;flex-direction:row;align-items:stretch;gap:8px;
      overflow-x:auto;overflow-y:hidden;padding:8px 12px;border-right:none;border-bottom:1px solid var(--line);
      -webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 12px;
    }
    nav.levels::-webkit-scrollbar{display:none;}
    .level-actions, .reset-btn.exit-btn{display:none;}
    .level-card{flex:0 0 auto;min-width:0;padding:8px 14px;scroll-snap-align:center;}
    .level-card[data-id="planta-baja"]{order:1;}
    .level-card[data-id="nivel-1"]{order:2;}
    .level-card[data-id="nivel-2"]{order:3;}
    .level-card[data-id="nivel-3"]{order:4;}
    .level-card[data-id="nivel-4"]{order:5;}
    .level-card[data-id="nivel-5"]{order:6;}
    .level-card .name{font-size:13px;white-space:nowrap;}
    .level-card .units{display:none;}
    .level-card .badge{margin-top:4px;font-size:9px;padding:2px 7px;white-space:nowrap;}

    /* modelo 3D: ocupa todo el espacio libre; el alto del panel inferior se reserva fijo
       (así el visor no cambia de proporción al elegir un nivel) */
    main.viewer{order:2;flex:1 1 0;min-width:0;min-height:0;margin-bottom:var(--peek-h);}
    .viewer-instructions{padding:6px 12px;font-size:10.5px;}

    /* panel inferior (hoja): cerrado = departamentos disponibles · abierto = + plano */
    aside.render-panel{
      position:absolute;left:0;right:0;bottom:0;z-index:20;order:3;width:100%;height:var(--peek-h);
      display:flex;flex-direction:column;overflow:hidden;
      background:var(--bg-panel);border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
      box-shadow:0 -8px 24px rgba(0,0,0,.35);transition:height .28s ease;
    }
    aside.render-panel.is-open{height:66%;}
    .sheet-handle{
      all:unset;box-sizing:border-box;flex:0 0 auto;width:100%;height:36px;
      display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
      color:var(--ink-dim);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
      -webkit-tap-highlight-color:transparent;touch-action:none;
    }
    .sheet-handle .grip{width:34px;height:4px;border-radius:2px;background:rgba(245,243,239,.3);}
    .sheet-handle .chev{display:inline-block;transition:transform .25s ease;}
    .render-panel.is-open .sheet-handle .chev{transform:rotate(180deg);}
    .render-panel:not(.has-level) .sheet-handle{visibility:hidden;}

    .render-body{
      display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;
      -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    }
    .render-panel:not(.is-open) .render-body{overflow:hidden;}
    .render-panel .ph{padding:6px 18px 18px;font-size:12.5px;}
    .render-panel .cap{
      order:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;
      padding:0 14px 8px;border-top:0;font-size:11.5px;
    }
    .render-panel .cap strong{display:inline;margin:0;font-size:17px;}
    .render-panel .cap br{display:none;}
    .render-panel .cap span{flex:0 0 100%;font-size:11px;}
    .units-section{order:1;padding:0 0 12px;border-top:0;overflow:visible;}
    .units-section h4{display:none;}
    .pb-desc{display:none;padding:0 14px;}
    .render-panel.is-open .pb-desc{display:block;}
    .units-row{
      display:flex;gap:10px;overflow-x:auto;padding:2px 14px 4px;scrollbar-width:none;
      scroll-snap-type:x proximity;scroll-padding:0 14px;-webkit-overflow-scrolling:touch;
    }
    .units-row::-webkit-scrollbar{display:none;}
    .unit-card{flex:0 0 82%;max-width:330px;margin:0;scroll-snap-align:start;}
    .unit-card .u-thumb{display:none;}
    .render-panel.is-open .unit-card .u-thumb{display:block;height:84px;}
    .unit-card .u-body{padding:10px 12px;}
    .unit-card .u-go{padding:12px 6px;margin:-12px -6px;}
    .render-img-wrap{order:2;width:fit-content;max-width:calc(100% - 28px);margin:8px auto 16px;}
    .render-img-wrap img{width:auto;max-width:100%;max-height:38vh;max-height:38dvh;}
  }
</style>
</head>
<body>

<!-- Barra superior solo-móvil: siempre visible, no se desplaza con nada -->
<header class="m-topbar">
  <button class="m-btn exit" id="mExitBtn" type="button">✕ Salir</button>
  <span class="m-title">Recorrido 3D</span>
  <button class="m-btn" id="mResetBtn" type="button">↺ Ver todo</button>
</header>

<div class="app">
  <nav class="levels" id="levelList">
    <div class="level-actions">
      <button class="reset-btn" id="resetBtn">↺ Ver Todo</button>
    </div>
    <!-- tarjetas generadas por JS -->
    <button class="reset-btn exit-btn" id="exitBtn">✕ Salir</button>
  </nav>

  <aside class="render-panel" id="renderSheet">
    <button class="sheet-handle" id="sheetHandle" type="button" aria-expanded="false">
      <span class="grip"></span><span id="sheetLabel">Ver plano del nivel</span><span class="chev">▲</span>
    </button>
    <div class="render-body" id="renderPanel">
      <div class="ph" id="renderPlaceholder">Elige un nivel de la lista para ver su render de interiores.</div>
    </div>
  </aside>

  <main class="viewer">
    <div class="viewer-instructions" id="viewerInstructions">Arrastra para girar el modelo · Rueda del mouse para acercar o alejar · Elige un nivel para ver sus departamentos</div>
    <div id="canvas-wrap"></div>
    <div class="debug-status" id="debugStatus"><span id="statusText">Cargando…</span><div class="bar"><i id="statusBar"></i></div></div>
  </main>
</div>

<script>
/* ================= Datos de niveles =================
   Preservados tal cual del kit de integración: coordenadas, precios y
   nombres de nodo del .glb están calibrados a mano — no recalcular. */
const LEVELS = [
  { id:'nivel-5',     label:'Nivel 5',     nodeName:null,               units:'401, 403 (dúplex)', img:'renders/nivel-05.webp' },
  { id:'nivel-4',     label:'Nivel 4',     nodeName:null,               units:'401, 403 (dúplex)', img:'renders/nivel-04.webp' },
  { id:'nivel-3',     label:'Nivel 3',     nodeName:null,               units:'301, 302, 303',     img:'renders/nivel-03.webp' },
  { id:'nivel-2',     label:'Nivel 2',     nodeName:'Piso_2_Nivel2',    units:'201, 202, 203, 204',img:'renders/nivel-02.webp' },
  { id:'nivel-1',     label:'Nivel 1',     nodeName:'Piso_1_Nivel1',    units:'101, 102, 103',     img:'renders/nivel-01.webp' },
  { id:'planta-baja', label:'Planta Baja', nodeName:'Piso_0_PlantaBaja',units:'Lobby y cochera',   img:'renders/planta-baja.webp' },
];

// Nivel 2: bandas REALES calculadas a partir de los polígonos vectorizados en
// Illustrator (nivel2_units.json), no una aproximación por partes iguales.
// Rectángulos REALES [x0,y0,x1,y1] (fracción 0-1 de la imagen), medidos directamente
// sobre cada render en Photoshop.
const LEVEL_BANDS = {
  'nivel-1': {
    '103': [0.1778, 0.3470, 0.7256, 0.5099],
  },
  'nivel-2': {
    '204': [0.0456, 0.0545, 0.8501, 0.2585],
    '201': [0.2966, 0.6384, 0.7352, 0.8522],
  },
  'nivel-3': {
    '301': [0.2132, 0.4437, 0.8382, 0.6408],
    '303': [0.0714, 0.0554, 0.9554, 0.2633],
  },
};
// Resto de niveles/unidades: aproximación por partes iguales (sin datos exactos aún).
const LEVEL_ORDER = {
  'nivel-4': { order:['404','403','402','401'], topOffset:0 },
  'nivel-5': { order:['404','403','402','401'], topOffset:0 },
};
// Devuelve siempre [x0,y0,x1,y1]. Para niveles sin datos exactos, usa una franja
// horizontal aproximada (x0=0.04, x1=0.96) dividida en partes iguales.
function getBand(levelId, unitId) {
  if (LEVEL_BANDS[levelId] && LEVEL_BANDS[levelId][unitId]) {
    return LEVEL_BANDS[levelId][unitId];
  }
  const cfg = LEVEL_ORDER[levelId];
  if (!cfg) return null;
  const idx = cfg.order.indexOf(unitId);
  if (idx === -1) return null;
  const N = cfg.order.length;
  const topOffset = cfg.topOffset || 0;
  const bandFrac = (1 - topOffset) / N;
  const y0 = topOffset + idx * bandFrac;
  return [0.04, y0, 0.96, y0 + bandFrac];
}
// Solo unidades DISPONIBLES por nivel (tabla real de precios/superficies).
// nodeName: nombre real del objeto separado en el .glb (null = aún sin separar).
const UNITS_BY_LEVEL = {
  'nivel-1': [
    { id:'103', nombre:'Depto 103', prototipo:'Studio',     m2:70.12,  precio:'2,323,000', nodeName:'cent_103' },
  ],
  'nivel-2': [
    { id:'201', nombre:'Depto 201', prototipo:'Loft',        m2:100.80, precio:'3,061,000', nodeName:'cent_201' },
    { id:'204', nombre:'Depto 204', prototipo:'Studio Max',  m2:88.80,  precio:'2,821,000', nodeName:'cent_204' },
  ],
  'nivel-3': [
    { id:'301', nombre:'Depto 301', prototipo:'Studio',      m2:70.90,  precio:'2,374,000', nodeName:'cent_301' },
    { id:'303', nombre:'Depto 303', prototipo:'Studio Max',  m2:88.80,  precio:'2,842,000', nodeName:'cent_303' },
  ],
  'nivel-4': [
    { id:'401', nombre:'Depto 401', prototipo:'Loft',        m2:100.80, precio:'3,259,000', nodeName:null },
    { id:'403', nombre:'Depto 403', prototipo:'Loft',        m2:103.11, precio:'3,333,000', nodeName:null },
  ],
  'nivel-5': [
    { id:'401', nombre:'Depto 401', prototipo:'Loft',        m2:100.80, precio:'3,259,000', nodeName:null },
    { id:'403', nombre:'Depto 403', prototipo:'Loft',        m2:103.11, precio:'3,333,000', nodeName:null },
  ],
};

// Cada nivel modelado es UNA sola malla completa (sin depas separados) — los
// depas se enfocan con Empties (puntos) en vez de mallas propias.
const LEVEL_GROUPS = {
  'nivel-1':     ['NIVEL01'],
  'nivel-2':     ['NIVEL02'],
  'nivel-3':     ['NIVEL03'],
  'planta-baja': ['PlantaBaja'],
};
const KNOWN_NODE_NAMES = ['NIVEL01','NIVEL02','NIVEL03','PlantaBaja',
  'cent_103','cent_201','cent_204','cent_301','cent_303',
  'CASETA','CASILLEROS','ELEVADOR','TERRAZA'];

/* ================= Conexión con la ficha real del sitio =================
   El modal de ficha vive en la página que embebe este iframe (ver
   js/ficha-modelo.js). Este visor solo pide que se abra, pasando el modelo
   (studio / studio-max / loft) y, si aplica, el número de depa exacto. */
function prototipoToFichaKey(prototipo) {
  return prototipo.toLowerCase().replace(/\s+/g, '-');
}
function abrirFichaReal(unitId, prototipo) {
  try {
    if (window.parent && typeof window.parent.openFicha === 'function') {
      window.parent.openFicha(prototipoToFichaKey(prototipo), unitId);
    }
  } catch (e) { /* iframe fuera de contexto (ej. abierto directo) — se ignora */ }
}

/* ================= Diagnóstico visible en pantalla ================= */
const debugEl = document.getElementById('debugStatus');
const statusTextEl = document.getElementById('statusText');
const statusBarEl = document.getElementById('statusBar');
function setStatus(msg, cls) {
  if (!debugEl) return;
  debugEl.style.display = '';
  debugEl.className = 'debug-status' + (cls ? ' ' + cls : '');
  statusTextEl.textContent = msg;
  const old = debugEl.querySelector('.retry');
  if (old) old.remove();
  if (cls === 'err') {
    const btn = document.createElement('button');
    btn.className = 'retry';
    btn.textContent = 'Reintentar';
    btn.addEventListener('click', () => location.reload());
    debugEl.appendChild(btn);
  }
}
function setProgress(pct) { if (statusBarEl) statusBarEl.style.width = pct + '%'; }
function hideStatus() { if (debugEl) debugEl.style.display = 'none'; }
let fatalShown = false; // ya se mostró un mensaje específico: el genérico no debe taparlo

  if (fatalShown) return;
  if (e.message && e.message.indexOf('ResizeObserver') !== -1) return; // warning benigno del navegador, no un error real
  setStatus('No se pudo mostrar el visor 3D.\n' + (e.message || e.error), 'err');

/* ================= Perfil de rendimiento =================
   Móvil / táctil → versión "lite": modelo con ~50 % de los triángulos y texturas
   pequeñas, sin sombras y con menos resolución de pantalla. Escritorio → modelo completo.
   ?lite=1 / ?lite=0 fuerzan un perfil (útil para probar). */
const qs = new URLSearchParams(location.search);
const IS_LITE = qs.has('lite')
  ? qs.get('lite') !== '0'
  : (window.matchMedia('(max-width:900px)').matches || window.matchMedia('(pointer:coarse)').matches);
const IS_TOUCH = window.matchMedia('(pointer:coarse)').matches;
const MODEL_VERSION = '20261024'; // súbelo cuando cambies un .glb (evita que se quede el viejo en caché)
const MODEL_URL = (IS_LITE ? 'torre-arbide-4niveles-lite.glb' : 'torre-arbide-4niveles.glb') + '?v=' + MODEL_VERSION;

    'Arrastra para girar · Pellizca para acercar o alejar · Elige un nivel para ver sus departamentos';
}

/* ================= Escena Three.js ================= */
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
scene.fog = new THREE.Fog(0x1a1d22, 900, 2200);

const camera = new THREE.PerspectiveCamera(42, wrap.clientWidth / wrap.clientHeight, 0.1, 5000);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  fatalShown = true;
  setStatus('Tu dispositivo no pudo iniciar el visor 3D (WebGL no disponible).', 'err');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_LITE ? 1.5 : 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.shadowMap.enabled = !IS_LITE;
wrap.appendChild(renderer.domElement);
// Si el sistema le quita el contexto WebGL a la página (poca memoria en móvil),
// se avisa en vez de dejar el visor en negro sin explicación.
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  setStatus('El dispositivo liberó la memoria gráfica del visor 3D.', 'err');
});

scene.add(new THREE.HemisphereLight(0xbfd4e6, 0x1a1a1a, IS_LITE ? 0.95 : 0.65));
const sun = new THREE.DirectionalLight(0xfff2d9, IS_LITE ? 0.8 : 0.9);
sun.position.set(300, 500, 250);
sun.castShadow = !IS_LITE;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -500; sun.shadow.camera.right = 500;
sun.shadow.camera.top = 500; sun.shadow.camera.bottom = -500;
scene.add(sun);

const grid = new THREE.GridHelper(1400, 28, 0x3a3f47, 0x272b31);
scene.add(grid);
const groundGeo = new THREE.PlaneGeometry(1400, 1400);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x202329, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ================= Órbita manual (arrastrar / pellizcar / rueda) ================= */
let radius = 60, theta = 0.0, phi = Math.PI * 0.42;
let targetPos = new THREE.Vector3(0, 20, 0);
let goalRadius = radius, goalTheta = theta, goalPhi = phi;
let goalTarget = targetPos.clone();
let defaultRadius = radius, defaultTheta = theta, defaultPhi = phi, defaultTarget = targetPos.clone();

// Devuelve true mientras la cámara todavía se está moviendo hacia su meta.
function updateCamera() {
  const dTarget = targetPos.distanceTo(goalTarget);
  const moving =
    Math.abs(goalRadius - radius) > goalRadius * 0.0005 ||
    Math.abs(goalTheta - theta) > 0.0003 ||
    Math.abs(goalPhi - phi) > 0.0003 ||
    dTarget > goalRadius * 0.0005;
  if (moving) {
    radius += (goalRadius - radius) * 0.12;
    theta += (goalTheta - theta) * 0.12;
    phi += (goalPhi - phi) * 0.12;
    targetPos.lerp(goalTarget, 0.12);
  } else {
    radius = goalRadius; theta = goalTheta; phi = goalPhi;
    targetPos.copy(goalTarget);
  }
  camera.position.x = targetPos.x + radius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = targetPos.y + radius * Math.cos(phi);
  camera.position.z = targetPos.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(targetPos);
  return applyViewShift() || moving;
}

// Móvil: al abrir el panel inferior tapa parte del visor; se desplaza la imagen hacia arriba
// (setViewOffset) para que el modelo siga centrado en el espacio que queda visible.
let viewShift = 0, viewShiftGoal = 0;
function applyViewShift() {
  const diff = viewShiftGoal - viewShift;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (Math.abs(diff) < 0.5) {
    const changed = viewShift !== viewShiftGoal;
    viewShift = viewShiftGoal;
    if (changed || camera.view) {
      if (viewShift === 0) camera.clearViewOffset();
      else camera.setViewOffset(w, h, 0, viewShift, w, h);
      camera.updateProjectionMatrix();
    }
    return changed;
  }
  viewShift += diff * 0.25;
  camera.setViewOffset(w, h, 0, viewShift, w, h);
  camera.updateProjectionMatrix();
  return true;
}

function zoomBy(factor) {
  const minR = Math.max(defaultRadius * 0.08, 1.5);
  const maxR = defaultRadius * 6;
  goalRadius = Math.max(minR, Math.min(maxR, goalRadius * factor));
}

// Un dedo / mouse: girar. Dos dedos: pellizcar para acercar o alejar.
const pointers = new Map();
let pinchPrev = 0;
const pinchDistance = () => {
  const [a, b] = [...pointers.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
};
const canvasEl = renderer.domElement;
canvasEl.addEventListener('pointerdown', e => {
  try { canvasEl.setPointerCapture(e.pointerId); } catch (_) { /* no crítico */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) pinchPrev = pinchDistance();
});
canvasEl.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    goalTheta -= dx * 0.006;
    goalPhi = Math.max(0.15, Math.min(1.45, goalPhi - dy * 0.006));
  } else if (pointers.size === 2) {
    const d = pinchDistance();
    if (pinchPrev > 0 && d > 0) zoomBy(pinchPrev / d);
    pinchPrev = d;
  }
  requestRender();
});
const endPointer = e => { pointers.delete(e.pointerId); pinchPrev = 0; };
canvasEl.addEventListener('pointerup', endPointer);
canvasEl.addEventListener('pointercancel', endPointer);
canvasEl.addEventListener('wheel', e => {
  e.preventDefault();
  const minR = Math.max(defaultRadius * 0.08, 1.5);
  const maxR = defaultRadius * 6;
  const step = e.deltaY * (defaultRadius * 0.0012);
  goalRadius = Math.max(minR, Math.min(maxR, goalRadius + step));
  requestRender();
}, { passive: false });

/* ================= Bucle de dibujo bajo demanda =================
   Antes se dibujaba el edificio completo 60 veces por segundo sin parar, aunque
   nadie lo moviera: en móvil eso agota batería y memoria. Ahora solo se dibuja
   cuando la cámara se mueve o algo cambia, y se pausa si la pestaña o el visor
   no están a la vista (la página principal avisa por postMessage). */
let needsRender = true, wasMoving = false, paused = false;
function requestRender() { needsRender = true; }
function animate() {
  requestAnimationFrame(animate);
  if (paused || document.hidden) return;
  const moving = updateCamera();
  if (moving || wasMoving || needsRender) {
    renderer.render(scene, camera);
    needsRender = false;
  }
  wasMoving = moving;
}
animate();
document.addEventListener('visibilitychange', requestRender);
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.visor3d === 'hidden') paused = true;
  if (e.data.visor3d === 'visible') { paused = false; requestRender(); }
});

/* ================= Carga del edificio (.glb comprimido con Meshopt) ================= */
let modelNodes = {};      // nodeName -> Object3D
let wholeBuildingBox = null, wholeBuildingSize = null, wholeBuildingCenter = null;

setStatus('Cargando modelo 3D…');
const loader = new THREE.GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

loader.load(MODEL_URL, (gltf) => {
  const model = gltf.scene;
  let meshCount = 0;
  model.traverse(obj => {
    if (!obj.isMesh) return;
    meshCount++;
    if (!IS_LITE) { obj.castShadow = true; obj.receiveShadow = true; }
  });
  scene.add(model);
  model.updateMatrixWorld(true);

  // Búsqueda insensible a mayúsculas/minúsculas: un cambio de capitalización en
  // Blender no debe romper el visor. Las llaves de modelNodes son los nombres canónicos.
  const nodesByLowerName = {};
  model.traverse(obj => { if (obj.name) nodesByLowerName[obj.name.toLowerCase()] = obj; });
  KNOWN_NODE_NAMES.forEach(name => {
    const node = nodesByLowerName[name.toLowerCase()];
    if (node) modelNodes[name] = node;
    else console.warn('[visor-3d] Nodo no encontrado en el .glb:', name);
  });

  wholeBuildingBox = new THREE.Box3().setFromObject(model);
  wholeBuildingSize = wholeBuildingBox.getSize(new THREE.Vector3());
  wholeBuildingCenter = wholeBuildingBox.getCenter(new THREE.Vector3());

  if (!isFinite(wholeBuildingSize.x) || wholeBuildingSize.x === 0) {
    fatalShown = true;
    setStatus('El modelo cargó (' + meshCount + ' mallas) pero sus medidas no son válidas.', 'err');
  } else {
    hideStatus();
  }

  frameWholeBuilding(true);
  buildLevelList();
  requestRender();
}, (xhr) => {
  if (xhr.lengthComputable && xhr.total) {
    const pct = Math.round((xhr.loaded / xhr.total) * 100);
    const mb = (xhr.total / 1048576).toFixed(0);
    setStatus('Cargando modelo 3D… ' + pct + '%  (' + mb + ' MB)');
    setProgress(pct);
  }
}, (err) => {
  fatalShown = true;
  setStatus('No se pudo cargar el modelo 3D.\nRevisa tu conexión e inténtalo de nuevo.', 'err');
  console.error(err);
});

/* ================= Encuadre de cámara ================= */
// En pantallas verticales (celular) el ancho visible es menor: se aleja la cámara
// para que el edificio no quede cortado por los lados.
function aspectFit() {
  const a = camera.aspect || 1.2;
  return a >= 1.15 ? 1 : Math.min(1.8, Math.pow(1.15 / Math.max(a, 0.3), 0.75));
}
// Re-encuadra la vista actual (nivel elegido o edificio completo), p. ej. al girar el celular.
function reframeCurrent() {
  if (!wholeBuildingBox) return;
  const group = currentLevelId && LEVEL_GROUPS[currentLevelId];
  const box = group ? computeGroupBox(group) : null;
  if (box) frameBox(box, true); else frameWholeBuilding(false);
}
function frameWholeBuilding(instant) {
  if (!wholeBuildingBox) return;
  const groundSize = Math.max(wholeBuildingSize.x, wholeBuildingSize.z, 10) * 3.5;
  ground.geometry.dispose();
  ground.geometry = new THREE.PlaneGeometry(groundSize, groundSize);
  ground.position.y = wholeBuildingBox.min.y - 0.05;
  grid.scale.setScalar(groundSize / 1400);
  grid.position.y = wholeBuildingBox.min.y - 0.03;

  const dist = Math.max(wholeBuildingSize.x, wholeBuildingSize.z, wholeBuildingSize.y, 10) * 0.85 * aspectFit() * (IS_TOUCH ? 0.75 : 1);
  goalTarget = wholeBuildingCenter.clone();
  goalRadius = dist;
  goalTheta = 0.6;
  goalPhi = Math.PI * 0.34;
  defaultTarget = goalTarget.clone();
  defaultRadius = goalRadius;
  defaultTheta = goalTheta;
  defaultPhi = goalPhi;
  if (instant) {
    targetPos.copy(goalTarget); radius = goalRadius; theta = goalTheta; phi = goalPhi;
  }
}

function computeGroupBox(names) {
  const box = new THREE.Box3();
  let any = false;
  names.forEach(n => {
    const node = modelNodes[n];
    if (node) { box.union(new THREE.Box3().setFromObject(node)); any = true; }
  });
  return any ? box : null;
}

function frameBox(box, angled) {
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const dist = Math.max(size.x, size.z, size.y, 3) * (angled ? 2.0 : 1.7) * aspectFit() * (IS_TOUCH ? 0.8 : 1);
  goalTarget = center;
  goalRadius = dist;
  goalTheta = angled ? 0.5 : 0;
  goalPhi = angled ? Math.PI * 0.36 : Math.PI * 0.42;
}

// Enfoca un punto (Empty) en vez de una malla completa — no hay tamaño real que
// medir, así que usamos una distancia de acercamiento proporcional al edificio.
function frameAtPoint(node) {
  const worldPos = new THREE.Vector3();
  node.getWorldPosition(worldPos);
  const dist = Math.max(defaultRadius * 0.15, 3);
  goalTarget = worldPos;
  goalRadius = dist;
  goalTheta = 0.5;
  goalPhi = Math.PI * 0.36;
}

/* ================= Selección de nivel ================= */
let currentLevelId = null;

function showOnlyGroup(names) {
  Object.entries(modelNodes).forEach(([name, node]) => {
    node.visible = names.includes(name);
  });
  requestRender();
}
function showAllNodes() {
  Object.values(modelNodes).forEach(node => node.visible = true);
  requestRender();
}

function selectLevel(levelId) {
  const lvl = LEVELS.find(l => l.id === levelId);
  if (!lvl) return;
  currentLevelId = levelId;

  document.querySelectorAll('.level-card').forEach(c =>
    c.classList.toggle('active', c.dataset.id === levelId)
  );

  const group = LEVEL_GROUPS[levelId];
  const box = group ? computeGroupBox(group) : null;
  if (group && box) {
    showOnlyGroup(group);
    frameBox(box, true);
  } else {
    // Aún no modelado en 3D: mostramos el edificio completo como referencia
    showAllNodes();
    frameWholeBuilding(false);
  }

  showRender(lvl);
  centerLevelChip(levelId);
}

function resetView() {
  currentLevelId = null;
  document.querySelectorAll('.level-card').forEach(c => c.classList.remove('active'));
  showAllNodes();
  frameWholeBuilding(false);
  clearRender();
}
document.getElementById('resetBtn').addEventListener('click', resetView);
document.getElementById('mResetBtn').addEventListener('click', resetView);
function salirDelVisor() {
  try {
    if (window.parent && typeof window.parent.salirVisor3d === 'function') {
      window.parent.salirVisor3d();
    }
  } catch (e) { /* iframe fuera de contexto (ej. abierto directo) — se ignora */ }
}
document.getElementById('exitBtn').addEventListener('click', salirDelVisor);
document.getElementById('mExitBtn').addEventListener('click', salirDelVisor);
// Con el foco dentro del iframe, la tecla Esc no llega a la página: se reenvía.

/* ================= Panel de render 2D + tarjetas de unidades ================= */
const renderPanel = document.getElementById('renderPanel');
const renderSheet = document.getElementById('renderSheet');
const sheetHandle = document.getElementById('sheetHandle');
const sheetLabel = document.getElementById('sheetLabel');
// Solo móvil: la hoja inferior muestra los departamentos; abierta, también el plano del nivel.
function setSheetOpen(open) {
  renderSheet.classList.toggle('is-open', open);
  sheetHandle.setAttribute('aria-expanded', String(open));
  sheetLabel.textContent = open ? 'Ocultar plano' : 'Ver plano del nivel';
  updateViewShiftGoal();
}
function updateViewShiftGoal() {
  const mobile = window.matchMedia('(max-width:900px)').matches;
  if (!mobile || !renderSheet.classList.contains('is-open')) { viewShiftGoal = 0; requestRender(); return; }
  const appH = document.querySelector('.app').clientHeight;
  const peek = parseFloat(getComputedStyle(renderSheet).getPropertyValue('--peek-h')) || 150;
  const cover = Math.max(0, appH * 0.66 - peek);   // lo que el panel abierto tapa del visor
  viewShiftGoal = cover / 2;                        // mitad: el modelo queda al centro de lo visible
  requestRender();
}
sheetHandle.addEventListener('click', () => setSheetOpen(!renderSheet.classList.contains('is-open')));
let sheetTouchY = null;
sheetHandle.addEventListener('touchstart', e => { sheetTouchY = e.touches[0].clientY; }, { passive: true });
sheetHandle.addEventListener('touchend', e => {
  if (sheetTouchY === null) return;
  const dy = e.changedTouches[0].clientY - sheetTouchY;
  sheetTouchY = null;
  if (dy < -30) setSheetOpen(true);        // desliza hacia arriba
  else if (dy > 30) setSheetOpen(false);   // desliza hacia abajo
  else return;
  e.preventDefault();                      // ya se atendió el gesto: evita el click duplicado
});
// Centra en el carrusel de niveles el que se acaba de elegir.
function centerLevelChip(levelId) {
  const nav = document.getElementById('levelList');
  const chip = nav.querySelector('.level-card[data-id="' + levelId + '"]');
  if (!chip || nav.scrollWidth <= nav.clientWidth) return;
  nav.scrollTo({ left: chip.offsetLeft - (nav.clientWidth - chip.offsetWidth) / 2, behavior: 'smooth' });
}
let selectedUnitId = null;
let selectedAmenity = null;

const PLANTA_BAJA_DESC = `
  <ul>
    <li><strong>Cajones de estacionamiento</strong> asignados por departamento.</li>
    <li><strong>Elevador</strong> con acceso directo desde el estacionamiento a todos los niveles.</li>
    <li>Lobby de recepción para visitas y paquetería.</li>
  </ul>
`;
const PLANTA_BAJA_AMENITIES = [
  { nodeName:'CASETA',     nombre:'Caseta de seguridad',        desc:'Control de acceso vehicular y peatonal.' },
  { nodeName:'CASILLEROS', nombre:'Cajones de almacenamiento',  desc:'Cubos de almacenamiento individuales por depto.' },
  { nodeName:'ELEVADOR',   nombre:'Elevador',                   desc:'Acceso directo desde el estacionamiento a todos los niveles.' },
  { nodeName:'TERRAZA',    nombre:'Terraza',                    desc:'Área de terraza del edificio.' },
];

function showRender(lvl) {
  selectedUnitId = null;
  selectedAmenity = null;
  const pendiente = !(LEVEL_GROUPS[lvl.id] && computeGroupBox(LEVEL_GROUPS[lvl.id]));
  let bodyHtml = `
    <div class="render-img-wrap">

    </div>
  `;

  if (lvl.id === 'planta-baja') {

          const spanY = Math.max(y1 - y0, 0.02);
          const sizeX = ((1 / spanX) * 100).toFixed(1) + '%';
          const sizeY = ((1 / spanY) * 100).toFixed(1) + '%';

function clearRender() {
  selectedUnitId = null;
  renderPanel.innerHTML = `<div class="ph" id="renderPlaceholder">Elige un nivel de la lista para ver su render de interiores.</div>`;
  renderSheet.classList.remove('has-level');

/* ================= Selección de unidad: sincroniza 3D + contorno + ficha real ================= */
function selectUnit(levelId, unitId) {
  const group = LEVEL_GROUPS[levelId];
  const groupBox = group ? computeGroupBox(group) : null;
  const unit = (UNITS_BY_LEVEL[levelId] || []).find(u => u.id === unitId);

  // Toggle: si ya estaba seleccionada, deselecciona y regresa a vista del piso completo
  if (selectedUnitId === unitId) {
    selectedUnitId = null;
    document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('selected'));
    hideHighlight();
    if (groupBox) frameBox(groupBox, true);
    return;
  }

  const band = getBand(levelId, unitId);
  selectedUnitId = unitId;
  document.querySelectorAll('.unit-card').forEach(c =>
    c.classList.toggle('selected', c.dataset.unit === unitId)
  );

  if (band) showHighlight(band[0], band[1], band[2], band[3]);
  else hideHighlight();

  // Si el depa ya tiene su punto de referencia (Empty) en el modelo, se enfoca ahí.
  if (unit && unit.nodeName && modelNodes[unit.nodeName]) {
    frameAtPoint(modelNodes[unit.nodeName]);
  }

}

// La tarjeta solo centra el modelo; la ficha se abre únicamente desde el texto "Ver ficha".
function verFichaDeUnidad(ev, unitId, prototipo) {
  ev.stopPropagation();
  abrirFichaReal(unitId, prototipo);
}

function showHighlight(x0, y0, x1, y1) {
  const el = document.getElementById('unitHighlight');
  if (!el) return;
  el.style.left = (x0 * 100) + '%';
  el.style.width = ((x1 - x0) * 100) + '%';
  el.style.top = (y0 * 100) + '%';
  el.style.height = ((y1 - y0) * 100) + '%';
  el.classList.add('visible');
}
function hideHighlight() {
  const el = document.getElementById('unitHighlight');
  if (el) el.classList.remove('visible');
}

function selectAmenity(nodeName) {
  if (selectedAmenity === nodeName) {
    selectedAmenity = null;
    document.querySelectorAll('[data-amenity]').forEach(c => c.classList.remove('selected'));
    const box = computeGroupBox(LEVEL_GROUPS['planta-baja']);
    if (box) frameBox(box, true);
    return;
  }
  selectedAmenity = nodeName;
  document.querySelectorAll('[data-amenity]').forEach(c =>
    c.classList.toggle('selected', c.dataset.amenity === nodeName)
  );
  const node = modelNodes[nodeName];
  if (node) frameAtPoint(node);
}

/* ================= Construcción de la lista de niveles ================= */
function buildLevelList() {
  const nav = document.getElementById('levelList');
  LEVELS.forEach(lvl => {
    const card = document.createElement('div');
    card.className = 'level-card';
    card.dataset.id = lvl.id;
    const modeled = !!(LEVEL_GROUPS[lvl.id] && computeGroupBox(LEVEL_GROUPS[lvl.id]));
    card.innerHTML = `
      <div class="name">${lvl.label}</div>
      <div class="units">Unidades ${lvl.units}</div>
      <span class="badge ${modeled ? 'modeled' : 'pending'}">${modeled ? 'MODELO 3D' : '3D PENDIENTE'}</span>
    `;
    card.addEventListener('click', () => selectLevel(lvl.id));
    nav.appendChild(card);
  });
}

/* ================= Ajuste al tamaño real del contenedor =================
   ResizeObserver en vez de window.resize: al vivir dentro de un <iframe>, el
   contenedor puede cambiar de tamaño por el reflow de la página externa
   (fuentes cargando, etc.) sin que el evento resize del propio iframe se dispare. */
function fitToContainer() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  const portraitBefore = camera.aspect < 1.15;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (portraitBefore !== (camera.aspect < 1.15)) reframeCurrent();
  updateViewShiftGoal();
  requestRender();
}
if (typeof ResizeObserver !== 'undefined') {
  // rAF evita el warning "ResizeObserver loop completed with undelivered
  // notifications" que dispara al mutar el tamaño del propio elemento observado.
  let fitRAF = null;
  const ro = new ResizeObserver(() => {
    if (fitRAF) cancelAnimationFrame(fitRAF);
    fitRAF = requestAnimationFrame(fitToContainer);
  });
  ro.observe(wrap);
} else {
  window.addEventListener('resize', fitToContainer);
}
fitToContainer();
</script>
